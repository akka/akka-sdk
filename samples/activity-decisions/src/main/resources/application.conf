akka.javasdk {
  agent {
    model-provider = openai
    openai {
      model-name = "gpt-4o-mini"
      api-key = ${?OPENAI_API_KEY}
    }
  }

  decision {
    model-provider = openai
    # The API key defaults to the OPENAI_API_KEY environment variable.
    openai {
      model-name = "gpt-6-luna"
    }
  }
}
