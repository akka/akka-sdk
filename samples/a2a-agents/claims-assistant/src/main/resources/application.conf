akka.javasdk {
  # The claims service of this sample uses the default port 9000.
  dev-mode.http-port = 9001

  agent {
    # Other AI models can be configured, see https://doc.akka.io/sdk/agents.html#model
    # and https://doc.akka.io/sdk/model-provider-details.html for the reference configurations.
    model-provider = openai

    openai {
      model-name = "gpt-4o-mini"
      # Environment variable override for the API key
      api-key = ${?OPENAI_API_KEY}
    }
  }

  a2a.remote-agents.claims {
    card-url = "http://localhost:9000/.well-known/agent-card.json"
    card-url = ${?CLAIMS_CARD_URL}
    # The remote agent of this sample sends no push notifications, so the service asks for the task.
    poll-interval = 2s
  }
}
