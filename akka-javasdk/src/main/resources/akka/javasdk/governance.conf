# Akka SDK default entries for the settings that the service inventory reads.

akka.javasdk.agent.guardrails {

  # Built-in jailbreak guardrail, evaluated before each model call.
  "default model-call jailbreak" {
    class = "akka.javasdk.agent.ModelCallSimilarityGuard"
    # not enabled until agents or agent-roles are defined
    agents = []
    agent-roles = []
    category = JAILBREAK
    report-only = false
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
  }

  # Deprecated: use "default model-call jailbreak" instead.
  "default jailbreak" {
    class = "akka.javasdk.agent.SimilarityGuard"
    # not enabled until agents or agent-roles are defined
    agents = []
    agent-roles = []
    category = JAILBREAK
    report-only = false
    use-for = ["model-request"]
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
  }

}
