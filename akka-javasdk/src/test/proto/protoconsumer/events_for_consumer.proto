syntax = "proto3";

package protoconsumer;

option java_outer_classname = "EventsForConsumer";

// for test coverage - consuming protobuf events from a Kalix service over service to service

message EventForConsumer1 {
  string text = 1;
}

message EventForConsumer2 {
  string text = 1;
}

message CircularParent {
  string id = 1;
  CircularChild child = 2;
}

message CircularChild {
  string name = 1;
  CircularParent parent = 2;
}

message SiblingParent {
  SiblingChild first = 1;
  SiblingChild second = 2;
}

message SiblingChild {
  string name = 1;
}

// Recursive through a map entry, a oneof and a repeated field
message TreeNode {
  map<string, TreeValue> children = 1;
}

message TreeValue {
  oneof kind {
    string leaf = 1;
    TreeNode node = 2;
    TreeList list = 3;
  }
}

message TreeList {
  repeated TreeValue values = 1;
}
