syntax = "proto3";

package protoconsumer;

import "google/protobuf/timestamp.proto";

option java_outer_classname = "EventsForConsumer";

// for test coverage - consuming protobuf events from a Kalix service over service to service

message EventForConsumer1 {
  string text = 1;
}

message EventForConsumer2 {
  string text = 1;
}

message CircularParent {
  string id = 1;
  CircularChild child = 2;
}

message CircularChild {
  string name = 1;
  CircularParent parent = 2;
}

// proto3 optional fields, for view schema presence coverage
message OptionalFields {
  string id = 1;
  optional string nickname = 2;
  optional google.protobuf.Timestamp review_date = 3;
}
