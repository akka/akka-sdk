syntax = "proto3";

package wellknown;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

option java_outer_classname = "WellKnownProtos";

// Fields of well-known types with a special JSON mapping, for view schema coverage
message WellKnownFields {
  google.protobuf.DoubleValue double_value = 1;
  google.protobuf.FloatValue float_value = 2;
  google.protobuf.Int64Value int64_value = 3;
  google.protobuf.UInt64Value uint64_value = 4;
  google.protobuf.Int32Value int32_value = 5;
  google.protobuf.UInt32Value uint32_value = 6;
  google.protobuf.BoolValue bool_value = 7;
  google.protobuf.StringValue string_value = 8;
  google.protobuf.BytesValue bytes_value = 9;
  repeated google.protobuf.StringValue string_values = 10;
  google.protobuf.Duration duration = 11;
  google.protobuf.FieldMask field_mask = 12;
}

message WithStruct {
  google.protobuf.Struct struct = 1;
}

message WithValue {
  google.protobuf.Value value = 1;
}

message WithListValue {
  google.protobuf.ListValue list_value = 1;
}

message WithAny {
  google.protobuf.Any any = 1;
}
