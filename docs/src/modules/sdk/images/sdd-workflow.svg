<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 130" role="img" aria-label="Spec-driven development workflow: init, specify, clarify, plan, tasks, implement, build, inspect, deploy, in sequence.">
  <title>Spec-driven development workflow</title>
  <style>
    .box{fill:#f5f5f7;stroke:#0b0b0c;stroke-width:1.5;rx:6}
    .lbl{font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#0b0b0c;text-anchor:middle}
    .arr{stroke:#0b0b0c;stroke-width:1.5;fill:none;marker-end:url(#a)}
    @media (prefers-color-scheme: dark){.box{fill:#1b1b1e;stroke:#e6e6e6}.lbl{fill:#e6e6e6}.arr{stroke:#e6e6e6}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0b0b0c"/></marker></defs>
  <g>
    <rect class="box" x="8"   y="46" width="86" height="38"/><text class="lbl" x="51"  y="70">init</text>
    <rect class="box" x="114" y="46" width="86" height="38"/><text class="lbl" x="157" y="70">specify</text>
    <rect class="box" x="220" y="46" width="86" height="38"/><text class="lbl" x="263" y="70">clarify</text>
    <rect class="box" x="326" y="46" width="86" height="38"/><text class="lbl" x="369" y="70">plan</text>
    <rect class="box" x="432" y="46" width="86" height="38"/><text class="lbl" x="475" y="70">tasks</text>
    <rect class="box" x="538" y="46" width="96" height="38"/><text class="lbl" x="586" y="70">implement</text>
    <rect class="box" x="654" y="46" width="86" height="38"/><text class="lbl" x="697" y="70">build</text>
    <rect class="box" x="760" y="46" width="86" height="38"/><text class="lbl" x="803" y="70">inspect</text>
    <rect class="box" x="866" y="46" width="86" height="38"/><text class="lbl" x="909" y="70">deploy</text>
    <path class="arr" d="M94 65 H114"/><path class="arr" d="M200 65 H220"/><path class="arr" d="M306 65 H326"/>
    <path class="arr" d="M412 65 H432"/><path class="arr" d="M518 65 H538"/><path class="arr" d="M634 65 H654"/>
    <path class="arr" d="M740 65 H760"/><path class="arr" d="M846 65 H866"/>
    <path class="arr" d="M697 84 V104 H369 V84" /><text class="lbl" x="533" y="120" font-weight="400">refine the spec and regenerate</text>
  </g>
</svg>
