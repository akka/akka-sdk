<svg xmlns="http://www.w3.org/2000/svg" width="144" height="88" viewBox="0 0 144 88" role="img" aria-labelledby="title desc">
  <title id="title">Origin-only processing</title>
  <desc id="desc">Only the Consumer in origin region A calls the external destination. Consumers in regions B and C skip the event.</desc>
  <rect width="144" height="88" rx="8" fill="#f4f4f5"/>
  <g fill="none" stroke="#71717a" stroke-width="2" stroke-dasharray="3 3">
    <circle cx="72" cy="22" r="14"/>
    <circle cx="120" cy="22" r="14"/>
  </g>
  <circle cx="24" cy="22" r="14" fill="#ffce4a" stroke="#18181b" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#18181b">
    <text x="24" y="26">A</text><text x="72" y="26">B</text><text x="120" y="26">C</text>
  </g>
  <path d="M24 38V48H72V58M68 54L72 58L76 54" fill="none" stroke="#18181b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="59" y="62" width="26" height="18" rx="3" fill="#00d8dd" stroke="#18181b" stroke-width="2"/>
</svg>
