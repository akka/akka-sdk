<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Service packaging</title>
  <desc id="desc">Four stages. Your services are packed into one binary. Instances of it run on any infrastructure: bare metal, virtual machines, Kubernetes, a platform as a service, or the edge. The instances form a cluster on their own, without a service mesh. Optionally, Akka Automated Operations operates the cluster for you.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffce4a"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="12" fill="#111111"/>

  <!-- Stage labels -->
  <text x="40" y="48" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">1  PACKAGE</text>
  <text x="246" y="48" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">2  RUN ANYWHERE</text>
  <text x="452" y="48" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">3  SELF-CLUSTER</text>
  <text x="658" y="48" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">4  OPTIONALLY</text>

  <!-- Panels -->
  <rect x="40" y="60" width="182" height="200" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <rect x="246" y="60" width="182" height="200" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <rect x="452" y="60" width="182" height="200" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <rect x="658" y="60" width="182" height="200" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>

  <!-- Arrows between panels -->
  <line x1="224" y1="160" x2="243" y2="160" stroke="#ffce4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="160" x2="449" y2="160" stroke="#ffce4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="636" y1="160" x2="655" y2="160" stroke="#ffce4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 Package -->
  <text x="131" y="92" text-anchor="middle" font-size="13" fill="#cccccc">your services</text>
  <rect x="62" y="104" width="40" height="26" rx="4" fill="none" stroke="#cccccc"/>
  <rect x="111" y="104" width="40" height="26" rx="4" fill="none" stroke="#cccccc"/>
  <rect x="160" y="104" width="40" height="26" rx="4" fill="none" stroke="#cccccc"/>
  <line x1="131" y1="136" x2="131" y2="158" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="62" y="162" width="138" height="40" rx="6" fill="#ffce4a"/>
  <text x="131" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">one binary</text>
  <text x="131" y="232" text-anchor="middle" font-size="13" fill="#cccccc">with the Akka runtime</text>

  <!-- 2 Run anywhere -->
  <text x="337" y="92" text-anchor="middle" font-size="13" fill="#cccccc">instances on</text>
  <rect x="268" y="104" width="138" height="24" rx="4" fill="none" stroke="#cccccc"/>
  <text x="337" y="121" text-anchor="middle" font-size="13" fill="#ffffff">bare metal</text>
  <rect x="268" y="132" width="138" height="24" rx="4" fill="none" stroke="#cccccc"/>
  <text x="337" y="149" text-anchor="middle" font-size="13" fill="#ffffff">virtual machines</text>
  <rect x="268" y="160" width="138" height="24" rx="4" fill="none" stroke="#cccccc"/>
  <text x="337" y="177" text-anchor="middle" font-size="13" fill="#ffffff">Kubernetes</text>
  <rect x="268" y="188" width="138" height="24" rx="4" fill="none" stroke="#cccccc"/>
  <text x="337" y="205" text-anchor="middle" font-size="13" fill="#ffffff">PaaS</text>
  <rect x="268" y="216" width="138" height="24" rx="4" fill="none" stroke="#cccccc"/>
  <text x="337" y="233" text-anchor="middle" font-size="13" fill="#ffffff">edge</text>

  <!-- 3 Self-cluster -->
  <rect x="470" y="96" width="146" height="96" rx="6" fill="none" stroke="#ffce4a" stroke-dasharray="4 3"/>
  <rect x="486" y="110" width="30" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <rect x="528" y="110" width="30" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <rect x="570" y="110" width="30" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <rect x="507" y="152" width="30" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <rect x="549" y="152" width="30" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <line x1="516" y1="123" x2="528" y2="123" stroke="#cccccc" stroke-dasharray="2 2"/>
  <line x1="558" y1="123" x2="570" y2="123" stroke="#cccccc" stroke-dasharray="2 2"/>
  <line x1="537" y1="165" x2="549" y2="165" stroke="#cccccc" stroke-dasharray="2 2"/>
  <line x1="510" y1="136" x2="518" y2="152" stroke="#cccccc" stroke-dasharray="2 2"/>
  <line x1="580" y1="136" x2="570" y2="152" stroke="#cccccc" stroke-dasharray="2 2"/>
  <text x="543" y="216" text-anchor="middle" font-size="13" fill="#ffffff">instances form a cluster</text>
  <text x="543" y="236" text-anchor="middle" font-size="13" fill="#cccccc">no service mesh</text>

  <!-- 4 AAO -->
  <rect x="680" y="104" width="138" height="26" rx="4" fill="none" stroke="#ffffff"/>
  <text x="749" y="122" text-anchor="middle" font-size="13" fill="#ffffff">your cluster</text>
  <rect x="680" y="136" width="138" height="40" rx="6" fill="#ffce4a"/>
  <text x="749" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">AAO</text>
  <text x="749" y="204" text-anchor="middle" font-size="13" fill="#ffffff">Akka Automated</text>
  <text x="749" y="222" text-anchor="middle" font-size="13" fill="#ffffff">Operations runs it</text>
  <text x="749" y="240" text-anchor="middle" font-size="13" fill="#cccccc">for you</text>
</svg>
