<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The path of one request</title>
  <desc id="desc">A sequence diagram in thirteen numbered steps. 1: the client sends a request to an endpoint. 2: the endpoint starts a workflow through the component client. 3: a workflow step calls the agent. 4: the agent's effect declares the model, the messages and the tools. 5: sanitizers mask data and a guardrail checks the model call. 6: the call goes through the model gateway, which routes it to a model and writes a capture. 7: the model replies and asks for a tool. 8: the agent's tool call, checked by a guardrail, sends a command to an entity. 9: the entity persists an event. 10: the event is in the journal and is replicated to other regions. 11: the reply, checked by a guardrail, returns through the workflow and the endpoint to the client. 12: the runtime writes the interaction to the ledger as a record. 13: an evaluator judges the interaction and its verdict is saved to the ledger as evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
  </defs>
  <rect width="880" height="640" rx="12" fill="#111111"/>

  <!-- Participants: x = 90, 180, 270, 360, 450, 540, 630, 720, 810 -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="52" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="90" y="45">Client</text>
    <rect x="142" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="180" y="45">Endpoint</text>
    <rect x="232" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="270" y="45">Workflow</text>
    <rect x="322" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="360" y="45">Agent</text>
    <rect x="412" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="450" y="37">Model</text><text x="450" y="53">gateway</text>
    <rect x="502" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="540" y="45">Model</text>
    <rect x="592" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="630" y="45">Entity</text>
    <rect x="682" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="720" y="45">Ledger</text>
    <rect x="772" y="20" width="76" height="40" rx="6" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/><text x="810" y="45">Evaluator</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="90" y1="60" x2="90" y2="620"/>
    <line x1="180" y1="60" x2="180" y2="620"/>
    <line x1="270" y1="60" x2="270" y2="620"/>
    <line x1="360" y1="60" x2="360" y2="620"/>
    <line x1="450" y1="60" x2="450" y2="620"/>
    <line x1="540" y1="60" x2="540" y2="620"/>
    <line x1="630" y1="60" x2="630" y2="620"/>
    <line x1="720" y1="60" x2="720" y2="620"/>
    <line x1="810" y1="60" x2="810" y2="620"/>
  </g>

  <!-- Step numbers -->
  <g font-size="12" font-weight="700" fill="#111111" text-anchor="middle">
    <circle cx="28" cy="96" r="11" fill="#ffce4a"/><text x="28" y="100">1</text>
    <circle cx="28" cy="134" r="11" fill="#ffce4a"/><text x="28" y="138">2</text>
    <circle cx="28" cy="172" r="11" fill="#ffce4a"/><text x="28" y="176">3</text>
    <circle cx="28" cy="210" r="11" fill="#ffce4a"/><text x="28" y="214">4</text>
    <circle cx="28" cy="248" r="11" fill="#ffce4a"/><text x="28" y="252">5</text>
    <circle cx="28" cy="286" r="11" fill="#ffce4a"/><text x="28" y="290">6</text>
    <circle cx="28" cy="324" r="11" fill="#ffce4a"/><text x="28" y="328">7</text>
    <circle cx="28" cy="362" r="11" fill="#ffce4a"/><text x="28" y="366">8</text>
    <circle cx="28" cy="400" r="11" fill="#ffce4a"/><text x="28" y="404">9</text>
    <circle cx="28" cy="438" r="11" fill="#ffce4a"/><text x="28" y="442">10</text>
    <circle cx="28" cy="480" r="11" fill="#ffce4a"/><text x="28" y="484">11</text>
    <circle cx="28" cy="530" r="11" fill="#ffce4a"/><text x="28" y="534">12</text>
    <circle cx="28" cy="572" r="11" fill="#ffce4a"/><text x="28" y="576">13</text>
  </g>

  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <!-- 1 request -->
    <line x1="90" y1="96" x2="178" y2="96" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="135" y="89">request</text>
    <!-- 2 start workflow -->
    <line x1="180" y1="134" x2="268" y2="134" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="225" y="127">start</text>
    <!-- 3 step calls agent -->
    <line x1="270" y1="172" x2="358" y2="172" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="315" y="165">call agent</text>
    <!-- 4 effect -->
    <rect x="290" y="198" width="140" height="24" rx="5" fill="#1f1f1f" stroke="#cccccc"/>
    <text x="360" y="215">effect: model, tools</text>
    <!-- 5 sanitizer and guardrail -->
    <rect x="280" y="236" width="160" height="24" rx="5" fill="#1f1f1f" stroke="#ffce4a"/>
    <text x="360" y="253" fill="#ffce4a">sanitizer, guardrail</text>
    <!-- 6 routed model call -->
    <line x1="360" y1="286" x2="448" y2="286" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="286" x2="538" y2="286" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="405" y="279">model call</text>
    <text x="497" y="279">routed, captured</text>
    <!-- 7 reply asks for a tool -->
    <line x1="540" y1="324" x2="362" y2="324" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
    <text x="495" y="317" fill="#cccccc">reply: use a tool</text>
    <!-- 8 tool call -->
    <line x1="360" y1="362" x2="628" y2="362" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="495" y="355">tool call, guardrail checked</text>
    <!-- 9 persist event -->
    <rect x="565" y="388" width="130" height="24" rx="5" fill="#1f1f1f" stroke="#cccccc"/>
    <text x="630" y="405">persist event</text>
    <!-- 10 journal and replication -->
    <rect x="550" y="426" width="160" height="24" rx="5" fill="#1f1f1f" stroke="#cccccc"/>
    <text x="630" y="443">journal, replicate</text>
    <!-- 11 reply back to the client -->
    <line x1="360" y1="480" x2="272" y2="480" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
    <line x1="270" y1="480" x2="182" y2="480" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
    <line x1="180" y1="480" x2="92" y2="480" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
    <text x="315" y="473" fill="#cccccc">reply</text>
    <text x="225" y="473" fill="#cccccc">result</text>
    <text x="135" y="473" fill="#cccccc">response</text>
    <text x="315" y="498" fill="#ffce4a">guardrail</text>
    <!-- 12 ledger record -->
    <line x1="360" y1="530" x2="718" y2="530" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="540" y="523">record of the interaction</text>
    <!-- 13 evaluation -->
    <line x1="720" y1="566" x2="808" y2="566" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="765" y="559">judge</text>
    <line x1="810" y1="592" x2="722" y2="592" stroke="#ffce4a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
    <text x="765" y="610" fill="#ffce4a">verdict: evidence</text>
  </g>
</svg>
