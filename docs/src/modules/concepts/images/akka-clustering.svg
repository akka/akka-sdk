<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Akka clustering</title>
  <desc id="desc">The nodes of a service form a cluster that provides discovery, consensus, split-brain resolution, request routing, scheduling, replication and point-to-point messaging. Data is sharded across nodes, and Akka routes each request to the node that holds the shard. When nodes are added, shards are rebalanced across the larger cluster.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="12" fill="#111111"/>

  <!-- Cluster capabilities -->
  <text x="40" y="44" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">THE CLUSTER PROVIDES</text>
  <rect x="40" y="56" width="800" height="72" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <g transform="translate(42 0)">
    <rect x="58" y="68" width="110" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="113" y="84">discovery</text>
    <rect x="178" y="68" width="110" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="233" y="84">consensus</text>
    <rect x="298" y="68" width="170" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="383" y="84">split-brain resolution</text>
    <rect x="478" y="68" width="140" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="548" y="84">request routing</text>
    <rect x="628" y="68" width="110" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="683" y="84">scheduling</text>
    </g>
    <g transform="translate(7 0)">
    <rect x="178" y="96" width="110" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="233" y="112">replication</text>
    <rect x="298" y="96" width="220" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="408" y="112">point-to-point messaging</text>
    <rect x="528" y="96" width="160" height="22" rx="4" fill="none" stroke="#cccccc"/><text x="608" y="112">no primary node</text>
    </g>
  </g>

  <!-- Sharded data -->
  <text x="40" y="164" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">SHARDED DATA</text>
  <rect x="40" y="176" width="392" height="184" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <text x="236" y="200" text-anchor="middle" font-size="13" fill="#cccccc">Each request goes to the node that holds its shard.</text>
  <text x="236" y="226" text-anchor="middle" font-size="13" fill="#ffffff">requests</text>
  <line x1="236" y1="232" x2="236" y2="248" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="166" y="250" width="140" height="26" rx="5" fill="#ffce4a"/>
  <text x="236" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Akka routing</text>
  <path d="M 200 276 L 200 288 L 130 288 L 130 300" fill="none" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 272 276 L 272 288 L 342 288 L 342 300" fill="none" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="302" width="100" height="44" rx="5" fill="none" stroke="#ffffff"/>
  <text x="130" y="320" text-anchor="middle" font-size="13" fill="#ffffff">node 1</text>
  <text x="130" y="338" text-anchor="middle" font-size="13" fill="#cccccc">shards 0-30</text>
  <rect x="292" y="302" width="100" height="44" rx="5" fill="none" stroke="#ffffff"/>
  <text x="342" y="320" text-anchor="middle" font-size="13" fill="#ffffff">node 2</text>
  <text x="342" y="338" text-anchor="middle" font-size="13" fill="#cccccc">shards 31-60</text>

  <!-- Rebalancing -->
  <text x="448" y="164" font-size="13" font-weight="700" fill="#ffce4a" letter-spacing="1">REBALANCING</text>
  <rect x="448" y="176" width="392" height="184" rx="8" fill="#1f1f1f" stroke="#02a4a7" stroke-width="2"/>
  <text x="644" y="200" text-anchor="middle" font-size="13" fill="#cccccc">Shards move as nodes join or leave.</text>
  <text x="644" y="226" text-anchor="middle" font-size="13" fill="#ffffff">requests</text>
  <line x1="644" y1="232" x2="644" y2="248" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="574" y="250" width="140" height="26" rx="5" fill="#ffce4a"/>
  <text x="644" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Akka routing</text>
  <path d="M 600 276 L 600 288 L 520 288 L 520 300" fill="none" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="644" y1="276" x2="644" y2="300" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 688 276 L 688 288 L 768 288 L 768 300" fill="none" stroke="#cccccc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="474" y="302" width="92" height="44" rx="5" fill="none" stroke="#ffffff"/>
  <text x="520" y="320" text-anchor="middle" font-size="13" fill="#ffffff">node 1</text>
  <text x="520" y="338" text-anchor="middle" font-size="13" fill="#cccccc">shards 0-20</text>
  <rect x="598" y="302" width="92" height="44" rx="5" fill="none" stroke="#ffffff"/>
  <text x="644" y="320" text-anchor="middle" font-size="13" fill="#ffffff">node 2</text>
  <text x="644" y="338" text-anchor="middle" font-size="13" fill="#cccccc">shards 21-40</text>
  <rect x="722" y="302" width="92" height="44" rx="5" fill="none" stroke="#ffce4a" stroke-dasharray="4 3"/>
  <text x="768" y="320" text-anchor="middle" font-size="13" fill="#ffce4a">node 3, new</text>
  <text x="768" y="338" text-anchor="middle" font-size="13" fill="#cccccc">shards 41-60</text>
</svg>
