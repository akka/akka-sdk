# Using a different port to not conflict with parallel tests
akka.javasdk.testkit.http-port = 39391

# used in user config test

akka.javasdk.dev-mode.service-name = "sdk-tests"
user-app.config-value = "some value"

# used in the gRPC endpoint/client test
akka.javasdk.grpc.client."some.example.com" {
  # configure external call, to call back to self
  host = "localhost"
  port = ${akka.javasdk.testkit.http-port}
  use-tls = false
}

# used in the gRPC endpoint/client test
akka.javasdk.grpc.client.other-service {
  # configure Akka service call, to call back to self
  host = "localhost"
  port = ${akka.javasdk.testkit.http-port}
  use-tls = false
}

akka.javasdk.agent.guardrails {
  "test jailbreak" {
    class = "akka.javasdk.agent.SimilarityGuard"
    agents = ["some-agent"]
    category = JAILBREAK
    use-for = ["model-request"]
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
  }

  "test guard" {
    class = "akkajavasdk.components.agent.TestGuardrail"
    agents = ["some-agent"]
    category = TOXIC
    use-for = ["model-response", "mcp-tool-response"]
    report-only = false
    search-for = "bad stuff"
  }

  "test model guard" {
    class = "akkajavasdk.components.agent.BlockingModelGuard"
    agents = ["model-guardrail-test-agent"]
    category = TOXIC
    use-for = ["before-agent-response"]
    report-only = false
    block-reason = "blocked by test model guard"
  }

  "before model call guard" {
    class = "akkajavasdk.components.agent.BeforeModelCallGuard"
    agents = ["before-model-call-guardrail-test-agent"]
    category = PROMPT_INJECTION
    use-for = ["before-model-call"]
    report-only = false
  }

  "classifier backed model guard" {
    class = "akkajavasdk.components.agent.ClassifierBackedModelGuard"
    agents = ["classifier-backed-guardrail-test-agent"]
    category = TOXIC
    use-for = ["before-agent-response"]
    report-only = false
    # governance-owned binding: which configured classifier this guardrail consults
    classifier = "toxicity-test-classifier"
  }
}

akka.javasdk.agent.classifiers {
  "toxicity-test-classifier" {
    class = "akkajavasdk.components.agent.ThresholdClassifier"
    threshold = 0.5
  }
  "dependency-provided-test-classifier" {
    class = "akkajavasdk.components.agent.DependencyProvidedClassifier"
  }
}

akka.javasdk.sanitization.regex-sanitizers = {
  "sanitized" = { pattern = "(sanitizesanitizesanitize)" }
}

# used in LedgerBackedEvaluatorIntegrationTest: the runtime triggers the evaluator for each
# interaction of the bound agent, and the evaluator fetches the interaction via the ledger client
akka.javasdk.evaluation.evaluators.ledger-eval-evaluator.agents.ledger-eval-agent {
  trigger = interaction
}
