# Using a different port to not conflict with parallel tests
akka.javasdk.testkit.http-port = 19391

# used in user config test

akka.javasdk.dev-mode.service-name = "sdk-tests"
user-app.config-value = "some value"

# used in the gRPC endpoint/client test
akka.javasdk.grpc.client."some.example.com" {
  # configure external call, to call back to self
  host = "localhost"
  port = ${akka.javasdk.testkit.http-port}
  use-tls = false
}

# used in the gRPC endpoint/client test
akka.javasdk.grpc.client.other-service {
  # configure Akka service call, to call back to self
  host = "localhost"
  port = ${akka.javasdk.testkit.http-port}
  use-tls = false
}

akka.javasdk.agent.guardrails {
  "test jailbreak" {
    class = "akka.javasdk.agent.SimilarityGuard"
    agents = ["some-agent"]
    category = JAILBREAK
    use-for = ["model-request"]
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
  }

  "default model-call jailbreak".agents = ["model-call-jailbreak-test-agent"]

  "report-only model-call jailbreak" {
    class = "akka.javasdk.agent.ModelCallSimilarityGuard"
    agents = ["model-call-jailbreak-report-only-test-agent"]
    category = JAILBREAK
    report-only = true
    threshold = 0.75
    bad-examples-resource-dir = "guardrail/jailbreak"
  }

  "test guard" {
    class = "akkajavasdk.components.agent.TestGuardrail"
    agents = ["some-agent"]
    category = TOXIC
    use-for = ["model-response", "mcp-tool-response"]
    report-only = false
    search-for = "bad stuff"
    control-id = "TEST-GR-01"
  }

  "test model guard" {
    class = "akkajavasdk.components.agent.BlockingResponseGuard"
    agents = ["model-guardrail-test-agent"]
    category = TOXIC
    report-only = false
    block-reason = "blocked by test model guard"
  }

  "before model call guard" {
    class = "akkajavasdk.components.agent.BeforeModelCallGuard"
    agents = ["before-model-call-guardrail-test-agent"]
    category = PROMPT_INJECTION
    report-only = false
  }

  "recording model call guard" {
    class = "akkajavasdk.components.agent.RecordingModelCallGuard"
    agents = ["non-blocking-guardrails-test-agent"]
    category = PROMPT_INJECTION
    report-only = false
  }

  "report only response guard" {
    class = "akkajavasdk.components.agent.BlockingResponseGuard"
    agents = ["non-blocking-guardrails-test-agent"]
    category = TOXIC
    report-only = true
    block-reason = "reported by test response guard"
  }

  "mixed legacy guard" {
    class = "akkajavasdk.components.agent.TestGuardrail"
    agents = ["mixed-guardrails-test-agent"]
    category = TOXIC
    use-for = ["model-response"]
    search-for = "bad stuff"
  }

  "mixed response guard" {
    class = "akkajavasdk.components.agent.BlockingResponseGuard"
    agents = ["mixed-guardrails-test-agent"]
    category = TOXIC
    block-reason = "blocked by mixed response guard"
  }

  "throwing response guard" {
    class = "akkajavasdk.components.agent.ThrowingResponseGuard"
    agents = ["throwing-guardrail-test-agent"]
    category = TOXIC
    report-only = false
    error-message = "thrown by test response guard"
  }

  "report only throwing response guard" {
    class = "akkajavasdk.components.agent.ThrowingResponseGuard"
    agents = ["report-only-throwing-guardrail-test-agent"]
    category = TOXIC
    report-only = true
    error-message = "thrown by report-only test response guard"
  }

  "denying tool guard" {
    class = "akkajavasdk.components.agent.DenyingToolGuard"
    agents = ["tool-call-guardrail-test-agent"]
    category = TOOL_POLICY
    deny-reason = "denied by test tool guard"
  }

  "autonomous model call guard" {
    class = "akkajavasdk.components.agent.BeforeModelCallGuard"
    agents = ["guarded-autonomous-agent"]
    category = PROMPT_INJECTION
  }

  "autonomous legacy request guard" {
    class = "akkajavasdk.components.agent.TestGuardrail"
    agents = ["legacy-guarded-autonomous-agent"]
    category = TOXIC
    use-for = ["model-request"]
    search-for = "forbidden topic"
  }

  "classifier backed model guard" {
    class = "akkajavasdk.components.agent.ClassifierBackedResponseGuard"
    agents = ["classifier-backed-guardrail-test-agent"]
    category = TOXIC
    report-only = false
    # governance-owned binding: which configured classifier this guardrail consults
    classifier = "toxicity-test-classifier"
  }
}

akka.javasdk.agent.classifiers {
  "toxicity-test-classifier" {
    class = "akkajavasdk.components.agent.ThresholdClassifier"
    threshold = 0.5
  }
  "dependency-provided-test-classifier" {
    class = "akkajavasdk.components.agent.DependencyProvidedClassifier"
  }
}

akka.javasdk.sanitization.sanitizers {
  # used in HttpEndpointTest, both through the deprecated handle and by name
  "sanitized" { pattern = "(sanitizesanitizesanitize)" }

  # the rest are used in SanitizerIntegrationTest
  "agent-scoped" {
    pattern = "(scopedsecret)"
    agents = ["sanitizer-test-agent"]
  }
  "role-scoped" {
    pattern = "(rolesecret)"
    agent-roles = ["sanitizer-role"]
  }
  "model-call-only" {
    pattern = "(modelsecret)"
    apply-at = ["model-call"]
  }
  "tool-result-only" {
    pattern = "(toolsecret)"
    apply-at = ["tool-result"]
  }
  "recording" {
    class = "akkajavasdk.components.agent.RecordingSanitizer"
    agents = ["sanitizer-test-agent"]
    replacement = "[recorded]"
  }
  "dependency-provided" {
    class = "akkajavasdk.components.agent.DependencyProvidedSanitizer"
    agents = ["no-such-agent"]
  }
  "switched-off" {
    pattern = "(disabledsecret)"
    enabled = false
  }
  "by-name-only" {
    pattern = "(clientsecret)"
    apply-at = ["client"]
  }
  # the same predefined group in two entries, each with its own scope
  "email-for-scoped-agent" {
    predefined = EMAIL
    agents = ["sanitizer-test-agent"]
  }
  "email-in-logs" {
    predefined = EMAIL
    apply-at = ["logs"]
    control-id = "TEST-SAN-01"
  }

  # used in LogSanitizerTest
  "log-masking" {
    class = "akkajavasdk.components.LogMaskingSanitizer"
    apply-at = ["logs"]
    replacement = "[log-masked]"
    control-id = "TEST-SAN-02"
  }
}

# used in LedgerBackedEvaluatorIntegrationTest: the runtime triggers the evaluator for each
# interaction of the bound agent, and the evaluator fetches the interaction via the ledger client
akka.javasdk.evaluation.evaluators.ledger-eval-evaluator.agents.ledger-eval-agent {
  trigger = interaction
}
akka.javasdk.evaluation.evaluators.ledger-eval-evaluator.control-id = "TEST-EV-01"

# DurableEvaluatorIntegrationTest adds the bindings of this evaluator
akka.javasdk.evaluation.evaluators.response-quality-durable-evaluator.control-id = "TEST-EV-02"
