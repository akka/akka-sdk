name: A2A interoperability

on:
  pull_request:
    paths:
      - 'akka-javasdk-tests/a2a-interop/**'
      - 'akka-javasdk-tests/src/test/java/akkajavasdk/A2aInteropServiceTest.java'
      - 'akka-javasdk-tests/src/test/java/akkajavasdk/A2aAdkEchoWorkflowTest.java'
      - 'akka-javasdk/src/main/scala/akka/javasdk/impl/a2a/**'
      - 'akka-javasdk-tests/src/test/java/akkajavasdk/components/a2a/**'
      - 'akka-javasdk/src/main/java/akka/javasdk/a2a/**'
      - 'akka-javasdk/src/main/java/akka/javasdk/impl/a2a/**'
      - '.github/workflows/a2a-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2a-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2a-interop:
    name: Run the A2A compatibility kit
    runs-on: Akka-Default
    env:
      # How long the test service of the SDK runs, in seconds
      A2A_INTEROP_SECONDS: 1800
    steps:
      - name: Checkout Global Scripts
        uses: actions/checkout@v6
        with:
          repository: akka/github-actions-scripts
          path: scripts
          fetch-depth: 0

      - name: Setup global resolver
        run: |
          chmod +x ./scripts/setup_global_resolver.sh
          ./scripts/setup_global_resolver.sh

      - name: Checkout
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@v6

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Cache Coursier cache
        # https://github.com/actions/cache/releases
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: coursier-v3-${{ hashFiles('project/plugins.sbt', 'project/build.properties') }}-${{ hashFiles('build.sbt', 'project/**.scala', 'project/**.sbt') }}
          restore-keys: |
            coursier-v3-${{ hashFiles('project/plugins.sbt', 'project/build.properties') }}-
            coursier-v3-
            coursier-v2-

      - name: Set up JDK 21
        # https://github.com/coursier/setup-action/releases
        uses: coursier/setup-action@v3.0.0
        with:
          jvm: temurin:1.21

      - name: Set up Python
        # https://github.com/actions/setup-python/releases
        uses: actions/setup-python@v6
        with:
          # The compatibility kit supports Python 3.11 to 3.14.
          python-version: '3.12'

      # The SDK client follows tasks of the a2a-python echo server, once by push notifications and once by
      # polling. It runs before the test service starts, so that only one sbt runs at a time.
      - name: Run the SDK client against the a2a-python echo server
        working-directory: akka-javasdk-tests/a2a-interop
        env:
          A2A_ADK_ECHO_PUSH_CARD: http://127.0.0.1:9101/.well-known/agent-card.json
          A2A_ADK_ECHO_POLL_CARD: http://127.0.0.1:9102/.well-known/agent-card.json
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r requirements.txt
          nohup .venv/bin/python adk_echo_server.py --port 9101 --push > echo-push.log 2>&1 &
          nohup .venv/bin/python adk_echo_server.py --port 9102 > echo-poll.log 2>&1 &
          for port in 9101 9102; do
            for i in $(seq 1 30); do
              curl --silent --fail http://127.0.0.1:$port/.well-known/agent-card.json > /dev/null && break
              if [ "$i" = 30 ]; then cat echo-push.log echo-poll.log; exit 1; fi
              sleep 1
            done
          done
          cd ../.. && sbt "akka-javasdk-tests/testOnly akkajavasdk.A2aAdkEchoWorkflowTest"

      # The test service publishes the kit task workflow first, then the echo skill, on port 19391. Its A2A routes
      # require a bearer token, so the kit and the client check reach it through bearer_proxy.py on port 9000.
      - name: Start the A2A test service of the SDK
        run: |
          nohup sbt "akka-javasdk-tests/testOnly akkajavasdk.A2aInteropServiceTest" > a2a-service.log 2>&1 &
          for i in $(seq 1 180); do
            curl --silent --fail http://127.0.0.1:19391/.well-known/agent-card.json > /dev/null && exit 0
            sleep 5
          done
          tail -n 200 a2a-service.log
          exit 1

      - name: Start the proxy that adds the bearer token
        working-directory: akka-javasdk-tests/a2a-interop
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r requirements.txt
          header=$(printf '{"alg":"none"}' | base64 -w0)
          claims=$(printf '{"iss":"a2a-test-issuer","sub":"interop"}' | base64 -w0)
          nohup .venv/bin/python bearer_proxy.py --port 9000 --target http://127.0.0.1:19391 \
            --token "${header}.${claims}" > proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:9000/.well-known/agent-card.json > /dev/null && exit 0
            sleep 1
          done
          cat proxy.log
          exit 1

      # The kit exits with a failure when a mandatory (MUST) requirement fails. Its recommended (SHOULD)
      # findings are written to the report and do not fail the job.
      - name: Run the compatibility kit
        working-directory: akka-javasdk-tests/a2a-interop
        run: ./run_tck.sh http://127.0.0.1:9000/.well-known/agent-card.json

      - name: Run the a2a-python client check on both bindings
        working-directory: akka-javasdk-tests/a2a-interop
        run: |
          .venv/bin/python adk_client_check.py http://127.0.0.1:9000/.well-known/agent-card.json --binding jsonrpc
          .venv/bin/python adk_client_check.py http://127.0.0.1:9000/.well-known/agent-card.json --binding http_json

      - name: Show the service log
        if: failure()
        run: tail -n 300 a2a-service.log

      - name: Show the echo server logs
        if: failure()
        working-directory: akka-javasdk-tests/a2a-interop
        run: tail -n 100 echo-push.log echo-poll.log || true

      - name: Upload the kit reports
        if: always()
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v7
        with:
          name: a2a-tck-reports
          path: akka-javasdk-tests/a2a-interop/reports
          if-no-files-found: ignore
