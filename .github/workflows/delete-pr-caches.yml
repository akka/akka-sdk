# https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries
name: Cleanup workflow caches by a branch
on:
  pull_request:
    types:
      - closed

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: Akka-Default
    steps:
      - name: Cleanup
        run: |
          echo "Fetching list of cache ids"
          # Delete by id. A delete by key also deletes the caches with the same key in other
          # refs, such as main.
          cacheIdsForPR=$(gh cache list --ref $BRANCH --limit 100 --json id --jq '.[].id')

          ## Setting this to not fail the workflow while deleting caches.
          set +e
          echo "Deleting caches..."
          for cacheId in $cacheIdsForPR
          do
              gh cache delete $cacheId
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh needs the repository name.
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
