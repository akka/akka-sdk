name: Checkout Optimize documentation
description: Check out the Optimize revision used by the SDK documentation build.
inputs:
  token:
    description: Token with read access to akka/nexus.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        repository: akka/nexus
        ref: v0.7.1
        path: nexus
        fetch-depth: 0
        sparse-checkout: |
          optimize-docs
          trainer/examples/spider-sql
        token: ${{ inputs.token }}
